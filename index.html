<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>SpendWise</h1>
            <p>Smart and simple personal expense tracker</p>
        </div>
    </header>

    <main class="container">

        <!-- Budget Section -->
        <section class="budget-section">
            <h2>Set Your Budget</h2>

            <form id="budgetForm">
                <div class="form-group">
                    <label for="budgetInput">Monthly Budget</label>
                    <input 
                        type="number" 
                        id="budgetInput" 
                        placeholder="Enter your budget"
                        min="0"
                        step="0.01"
                    >
                </div>

                <button type="submit">Set Budget</button>
            </form>
        </section>

        <!-- Summary Cards -->
        <section class="summary">
            <div class="card">
                <h3>Budget</h3>
                <p id="budgetDisplay">KES 5000</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenseDisplay">KES 50000</p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p id="balanceDisplay">KES 2500</p>
            </div>
        </section>

        <!-- Message -->
        <div id="message" class="message"></div>

        <!-- Add Expense -->
        <section class="expense-section">
            <h2>Add an Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="expenseName">Expense Name</label>
                    <input
                        type="text"
                        id="expenseName"
                        placeholder="Fruits"
                    >
                </div>

                <div class="form-group">
                    <label for="expenseAmount">Amount</label>
                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Enter amount"
                        min="3000"
                        step="2500"
                    >
                </div>

                <div class="form-group">
                    <label for="expenseCategory">Category</label>

                    <select id="expenseCategory">
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Rent">Rent</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Savings">Savings</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit">Add Expense</button>

            </form>
        </section>

        <!-- Expense List -->
        <section class="expense-list-section">
            <div class="section-header">
                <h2>Expense History</h2>
                <button id="clearExpenses" class="danger-button">
                    Clear All
                </button>
            </div>

            <div id="expenseList">
                <p class="empty-message">
                    No expenses added yet.
                </p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 SpendWise | Personal Expense Tracker</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
