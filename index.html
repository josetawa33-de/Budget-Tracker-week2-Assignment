<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>SpendWise</h1>
        <p>Simple Budget and Expense Tracker</p>

        <div class="card">
            <h2>Budget Information</h2>

            <form id="budgetForm">

                <label for="budgetInput">Total Budget</label>
                <input
                    type="number"
                    id="budgetInput"
                    placeholder="Enter your budget"
                    step="0.01"
                    min="0"
                    required
                >

                <label for="expensesInput">Total Expenses</label>
                <input
                    type="number"
                    id="expensesInput"
                    placeholder="Enter your expenses"
                    step="0.01"
                    min="0"
                    required
                >

                <button type="submit">Calculate Budget</button>

                <p id="errorMessage"></p>

            </form>
        </div>

        <div class="card">
            <h2>Budget Summary</h2>

            <p>Budget: <span id="budget">0</span></p>
            <p>Expenses: <span id="expenses">0</span></p>
            <p>Remaining Balance: <span id="balance">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
