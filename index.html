<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>SpendWise</h1>
        <p>Simple Budget and Expense Tracker</p>

        <div class="card">
            <h2>Budget Summary</h2>

            <p>Budget: <span id="budget">0</span></p>
            <p>Expenses: <span id="expenses">0</span></p>
            <p>Remaining Balance: <span id="balance">0</span></p>

            <button onclick="startBudget()">Enter Budget Information</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
